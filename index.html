<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오류의 방 · CRE 호흡기감염 격리병실</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="hud">
      <div class="hud-title">오류의 방 · CRE + 호흡기감염 격리병실</div>
      <div class="hud-stats">
        <span>발견 <b id="found">0</b> / <b id="total">0</b></span>
        <span>오답 <b id="wrong">0</b></span>
        <span>시간 <b id="timer">00:00</b></span>
      </div>
      <div class="hud-help">PC: 드래그로 둘러보기 · 클릭으로 오류 지목 | VR: 컨트롤러 트리거로 지목</div>
    </div>
    <div id="feedback" class="hidden"></div>
    <div id="result" class="hidden"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
